image:
  # The published image (linux/amd64 and linux/arm64). Set this to your own
  # registry if you build the image yourself.
  repository: docker.io/ashutosh5786/ashbox-controller
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# More than one replica needs leader election (on by default).
replicaCount: 1

controller:
  # Baggage entry that carries the routing key: "baggage: <key>=<sandbox>".
  baggageKey: routing-key
  # Mesh-specific checks: none, or istio (reports namespaces without a waypoint).
  mesh: none
  degradedAfter: 5m
  recoveredAfter: 1m
  logLevel: info

# Who may create sandboxes. The chart always creates the ClusterRole
# "<release>-user"; list subjects here to bind it, for example:
#   - kind: Group
#     name: developers
#     apiGroup: rbac.authorization.k8s.io
users:
  subjects: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

metrics:
  enabled: true
  port: 8080

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
