---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: sandboxes.ashbox.dev
spec:
  group: ashbox.dev
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    shortNames:
    - sbx
    singular: sandbox
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.routingKey
      name: Key
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Sandbox is a set of forked workloads (and laptop tunnels) reached by one
          routing key.

          Cluster-scoped, because a sandbox owns objects in many namespaces and an
          ownerReference may not cross namespaces to a namespaced owner.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SandboxSpec is the wanted state of a sandbox.

              The routing key never changes after creation: routingKey and keySource
              cannot be added, removed or changed by an update.
            properties:
              description:
                type: string
              forks:
                items:
                  description: Fork runs a changed copy of a baseline workload in
                    the cluster.
                  properties:
                    customizations:
                      description: Customizations change the fork compared to its
                        baseline.
                      properties:
                        env:
                          items:
                            description: EnvVar represents an environment variable
                              present in a Container.
                            properties:
                              name:
                                description: |-
                                  Name of the environment variable.
                                  May consist of any printable ASCII characters except '='.
                                type: string
                              value:
                                description: |-
                                  Variable references $(VAR_NAME) are expanded
                                  using the previously defined environment variables in the container and
                                  any service environment variables. If a variable cannot be resolved,
                                  the reference in the input string will be unchanged. Double $$ are reduced
                                  to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                                  "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                                  Escaped references will never be expanded, regardless of whether the variable
                                  exists or not.
                                  Defaults to "".
                                type: string
                              valueFrom:
                                description: Source for the environment variable's
                                  value. Cannot be used if value is not empty.
                                properties:
                                  configMapKeyRef:
                                    description: Selects a key of a ConfigMap.
                                    properties:
                                      key:
                                        description: |-
                                          The key to select from the ConfigMap's Data field.
                                          Keys in the BinaryData field are not currently propagated to container env vars.
                                        type: string
                                      name:
                                        default: ""
                                        description: |-
                                          Name of the referent.
                                          This field is effectively required, but due to backwards compatibility is
                                          allowed to be empty. Instances of this type with an empty value here are
                                          almost certainly wrong.
                                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                        type: string
                                      optional:
                                        description: Specify whether the ConfigMap
                                          or its key must be defined
                                        type: boolean
                                    required:
                                    - key
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  fieldRef:
                                    description: |-
                                      Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                      spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                                    properties:
                                      apiVersion:
                                        description: Version of the schema the FieldPath
                                          is written in terms of, defaults to "v1".
                                        type: string
                                      fieldPath:
                                        description: Path of the field to select in
                                          the specified API version.
                                        type: string
                                    required:
                                    - fieldPath
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  fileKeyRef:
                                    description: |-
                                      FileKeyRef selects a key of the env file.
                                      Requires the EnvFiles feature gate to be enabled.
                                    properties:
                                      key:
                                        description: |-
                                          The key within the env file. An invalid key will prevent the pod from starting.
                                          The keys defined within a source may consist of any printable ASCII characters except '='.
                                          During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                        type: string
                                      optional:
                                        default: false
                                        description: |-
                                          Specify whether the file or its key must be defined. If the file or key
                                          does not exist, then the env var is not published.
                                          If optional is set to true and the specified key does not exist,
                                          the environment variable will not be set in the Pod's containers.

                                          If optional is set to false and the specified key does not exist,
                                          an error will be returned during Pod creation.
                                        type: boolean
                                      path:
                                        description: |-
                                          The path within the volume from which to select the file.
                                          Must be relative and may not contain the '..' path or start with '..'.
                                        type: string
                                      volumeName:
                                        description: The name of the volume mount
                                          containing the env file.
                                        type: string
                                    required:
                                    - key
                                    - path
                                    - volumeName
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  resourceFieldRef:
                                    description: |-
                                      Selects a resource of the container: only resources limits and requests
                                      (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                                    properties:
                                      containerName:
                                        description: 'Container name: required for
                                          volumes, optional for env vars'
                                        type: string
                                      divisor:
                                        anyOf:
                                        - type: integer
                                        - type: string
                                        description: Specifies the output format of
                                          the exposed resources, defaults to "1"
                                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                        x-kubernetes-int-or-string: true
                                      resource:
                                        description: 'Required: resource to select'
                                        type: string
                                    required:
                                    - resource
                                    type: object
                                    x-kubernetes-map-type: atomic
                                  secretKeyRef:
                                    description: Selects a key of a secret in the
                                      pod's namespace
                                    properties:
                                      key:
                                        description: The key of the secret to select
                                          from.  Must be a valid secret key.
                                        type: string
                                      name:
                                        default: ""
                                        description: |-
                                          Name of the referent.
                                          This field is effectively required, but due to backwards compatibility is
                                          allowed to be empty. Instances of this type with an empty value here are
                                          almost certainly wrong.
                                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                        type: string
                                      optional:
                                        description: Specify whether the Secret or
                                          its key must be defined
                                        type: boolean
                                    required:
                                    - key
                                    type: object
                                    x-kubernetes-map-type: atomic
                                type: object
                            required:
                            - name
                            type: object
                          type: array
                        images:
                          items:
                            description: ImageOverride sets the image of one container.
                            properties:
                              container:
                                type: string
                              image:
                                type: string
                            required:
                            - container
                            - image
                            type: object
                          type: array
                        patch:
                          description: Patch is applied to the forked Deployment after
                            images and env.
                          properties:
                            type:
                              description: PatchType is the kind of patch applied
                                to the forked workload.
                              enum:
                              - strategic
                              - merge
                              - json
                              type: string
                            value:
                              type: string
                          required:
                          - type
                          - value
                          type: object
                      type: object
                    forkOf:
                      description: WorkloadRef points at a baseline workload.
                      properties:
                        kind:
                          default: Deployment
                          description: WorkloadKind is the kind of baseline workload
                            a fork copies.
                          enum:
                          - Deployment
                          - Rollout
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                  required:
                  - forkOf
                  type: object
                type: array
              keySource:
                description: |-
                  KeySource is a stable identity the routing key is derived from, such
                  as "github.com/acme/shop#42". The same source always gives the same
                  key, also when the sandbox is deleted and created again. Immutable.

                  With neither routingKey nor keySource, the key is derived from the
                  sandbox's UID: unique, but new for every sandbox.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: keySource is immutable
                  rule: self == oldSelf
              local:
                items:
                  description: |-
                    Local sends keyed traffic for a baseline workload to a laptop.

                    The laptop side is k8s-tunnel: `ashctl` exposes a local port, and the tunnel
                    server publishes it as an ordinary Service. ashbox only routes keyed
                    requests for the baseline Services to that tunnel Service.
                  properties:
                    from:
                      description: WorkloadRef points at a baseline workload.
                      properties:
                        kind:
                          default: Deployment
                          description: WorkloadKind is the kind of baseline workload
                            a fork copies.
                          enum:
                          - Deployment
                          - Rollout
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                    mappings:
                      items:
                        description: LocalMapping sends one baseline Service port
                          to one port of the tunnel Service.
                        properties:
                          port:
                            description: Port is the baseline Service port.
                            format: int32
                            type: integer
                          tunnelPort:
                            description: TunnelPort is the port of the tunnel Service.
                              Defaults to Port.
                            format: int32
                            type: integer
                        required:
                        - port
                        type: object
                      type: array
                    name:
                      type: string
                    tunnel:
                      description: ServiceRef points at a Service.
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      - namespace
                      type: object
                  required:
                  - from
                  - mappings
                  - name
                  - tunnel
                  type: object
                type: array
              routingKey:
                description: |-
                  RoutingKey sets the routing key directly: 8 to 32 lower-case letters,
                  digits and '-'. Immutable.
                pattern: ^[a-z0-9][a-z0-9-]{6,30}[a-z0-9]$
                type: string
                x-kubernetes-validations:
                - message: routingKey is immutable
                  rule: self == oldSelf
              ttl:
                description: TTL is how long a sandbox lives.
                properties:
                  duration:
                    description: Duration such as "4h", "30m" or "14d".
                    type: string
                  offsetFrom:
                    default: createdAt
                    description: TTLOffset is the time a TTL counts from.
                    enum:
                    - createdAt
                    - updatedAt
                    type: string
                required:
                - duration
                type: object
            type: object
            x-kubernetes-validations:
            - message: routingKey cannot be added or removed after creation
              rule: has(self.routingKey) == has(oldSelf.routingKey)
            - message: keySource cannot be added or removed after creation
              rule: has(self.keySource) == has(oldSelf.keySource)
            - message: set routingKey or keySource, not both
              rule: '!(has(self.routingKey) && has(self.keySource))'
          status:
            description: SandboxStatus is the observed state of a sandbox.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiresAt:
                format: date-time
                type: string
              forks:
                items:
                  description: ForkStatus is the state of one fork.
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    notReadySince:
                      description: NotReadySince is when the fork went down. Cleared
                        once it has recovered.
                      format: date-time
                      type: string
                    ready:
                      type: boolean
                    readySince:
                      description: ReadySince is when a down fork came back. Set only
                        while recovering.
                      format: date-time
                      type: string
                    reason:
                      type: string
                  required:
                  - name
                  - ready
                  type: object
                type: array
              phase:
                description: Phase is the reported state of a sandbox.
                enum:
                - Pending
                - Ready
                - Degraded
                - Failed
                - Expired
                type: string
              routingKey:
                description: |-
                  RoutingKey is the key requests carry to reach this sandbox:
                  "baggage: <baggage key>=<routingKey>". Set once by the controller,
                  then never changed.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
