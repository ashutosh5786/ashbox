# Role for people (and CI) who create sandboxes. They need no access to
# Deployments or routes: the controller creates those.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ashbox.fullname" . }}-user
  labels:
    {{- include "ashbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["ashbox.dev"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- with .Values.users.subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ashbox.fullname" $ }}-user
  labels:
    {{- include "ashbox.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ashbox.fullname" $ }}-user
subjects:
  {{- toYaml . | nindent 2 }}
{{- end }}
